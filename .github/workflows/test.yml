name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 运行单元测试
        run: node tests/run.js
      - name: 校验 Service Worker 预缓存清单与页面引用一致
        run: node scripts/check-sw-assets.js
