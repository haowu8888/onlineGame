<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="仙卡录 - 抽取修仙角色卡，编排五人阵容自动战斗。收集、升级、突破，探索三十章秘境。">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <title>仙卡录 - 仙界游坊</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127956;</text></svg>">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" as="style" onload="this.rel='stylesheet'">
  <noscript><link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="../css/shared.css?v=34">
  <link rel="stylesheet" href="../css/pwa.css?v=34">
  <link rel="stylesheet" href="../css/cardcollect.css?v=34">
  <link rel="stylesheet" href="../css/game-shell.css?v=34">
  <link rel="stylesheet" href="../css/cardcollect-roster.css?v=34">
  <link rel="stylesheet" href="../css/game-three.css?v=34">
</head>
<body class="game-page cardcollect-page">
  <div class="app-loading"><div class="app-loading-spinner"></div></div>
  <div class="particles-container" id="particles"></div>
  <nav class="game-nav">
    <a href="../index.html" class="game-nav-back">&larr; 仙界游坊</a>
    <span class="game-nav-title">仙卡录</span>
  </nav>
  <div class="page-wrapper">
    <div class="game-container cc-container">
      <header class="cc-masthead">
        <div><p class="cc-eyebrow">结仙缘 · 录群英</p><h1>仙卡录</h1><p>五位仙友，一同闯荡三十重秘境。</p></div>
        <div class="cc-masthead-seal" aria-hidden="true">仙<br>缘</div>
      </header>
      <!-- 顶部状态栏 -->
      <div class="cc-header">
        <div class="cc-currency">
          <span class="cc-stone-icon">💎</span>
          <span class="cc-stone-count" id="stone-count">1000</span>
          <span class="cc-stone-label">灵石</span>
        </div>
        <div class="cc-info">
          <span class="cc-chapter-info" id="chapter-info">最高通关：第0章</span>
          <span class="cc-card-count" id="card-count">卡牌：0/31</span>
        </div>
      </div>

      <!-- Tab导航 -->
      <div class="cc-tabs" id="cc-tabs">
        <button class="cc-tab active" data-tab="team">阵容</button>
        <button class="cc-tab" data-tab="chapter">秘境</button>
        <button class="cc-tab" data-tab="gacha">召唤</button>
        <button class="cc-tab" data-tab="collection">图鉴</button>
      </div>

      <!-- 阵容面板 -->
      <div class="cc-panel active" id="panel-team" data-panel="team">
        <div id="game-scene-mount"></div>
        <div class="cc-section-heading"><h2 class="cc-panel-title">五人出战阵容</h2><button class="btn btn-gold btn-sm" id="btn-team-chapter">前往秘境 →</button></div>
        <div class="cc-team-summary" id="team-summary" aria-label="阵容属性汇总"></div>
        <div class="cc-team-toolbar" id="team-actions">
          <label for="cc-roster-sort">角色排序 <select id="cc-roster-sort"><option value="quality">品质优先</option><option value="atk">攻击优先</option><option value="hp">生命优先</option></select></label>
          <button class="btn btn-outline btn-sm" id="btn-auto-team" title="按当前排序，从全部已拥有的角色中选择前五位">按品质上阵</button>
          <button class="btn btn-outline btn-sm" id="btn-clear-team">清空阵容</button>
        </div>
        <div class="cc-team-slots" id="team-slots"></div>
        <div class="cc-team-formations" id="team-formations"></div>
        <div class="cc-section-heading cc-bench-heading"><h3 class="cc-panel-title">仙友名册</h3><span id="cc-roster-count"></span></div>
        <div class="cc-selection-help"><p id="cc-replace-hint" role="status"></p><button class="btn btn-outline btn-sm" id="cc-cancel-slot" hidden>取消换将</button></div>
        <div class="cc-bench-filter" id="bench-filter">
          <button class="cc-filter-btn active" data-filter="all">全部</button>
          <button class="cc-filter-btn" data-filter="ATK">攻击</button>
          <button class="cc-filter-btn" data-filter="DEF">防御</button>
          <button class="cc-filter-btn" data-filter="SUP">辅助</button>
        </div>
        <div class="cc-bench-list" id="bench-list"></div>
      </div>

      <!-- 秘境面板 -->
      <div class="cc-panel" id="panel-chapter" data-panel="chapter">
        <h3 class="cc-panel-title">秘境探索</h3>
        <div class="cc-chapter-grid" id="chapter-grid"></div>
      </div>

      <!-- 召唤面板 -->
      <div class="cc-panel" id="panel-gacha" data-panel="gacha">
        <h3 class="cc-panel-title">灵石召唤</h3>
        <div class="cc-gacha-banner">
          <p class="cc-gacha-intro">以灵石结缘，邀仙友同行。</p>
          <div class="cc-gacha-showcase" id="gacha-showcase" aria-label="卡池角色示例"></div>
          <p class="cc-gacha-rates"></p>
          <p id="pity-info" class="cc-pity-info"></p>
        </div>
        <div class="cc-gacha-buttons">
          <button class="btn btn-gold" id="btn-pull1">单抽 (100灵石)</button>
          <button class="btn btn-cyan" id="btn-pull10">十连 (900灵石)</button>
        </div>
        <div class="cc-gacha-results" id="gacha-results"></div>
      </div>

      <!-- 图鉴面板 -->
      <div class="cc-panel" id="panel-collection" data-panel="collection">
        <h3 class="cc-panel-title">角色图鉴</h3>
        <div class="cc-collection-filter" id="collection-filter">
          <button class="cc-filter-btn active" data-filter="all">全部</button>
          <button class="cc-filter-btn" data-filter="凡">凡</button>
          <button class="cc-filter-btn" data-filter="灵">灵</button>
          <button class="cc-filter-btn" data-filter="仙">仙</button>
          <button class="cc-filter-btn" data-filter="圣">圣</button>
        </div>
        <div class="cc-collection-grid" id="collection-grid"></div>
      </div>

      <!-- 战斗界面（覆盖层） -->
      <div class="cc-battle-overlay" id="battle-overlay">
        <div class="cc-battle-scene">
          <div class="cc-battle-header">
            <span class="cc-battle-chapter" id="battle-chapter-name"></span>
            <span class="cc-battle-wave" id="battle-wave-info"></span>
          </div>
          <div class="cc-battle-field">
            <div class="cc-battle-side cc-allies" id="battle-allies"></div>
            <div class="cc-battle-vs">VS</div>
            <div class="cc-battle-side cc-enemies" id="battle-enemies"></div>
          </div>
          <div class="cc-battle-log" id="battle-log"></div>
          <div class="cc-battle-controls">
            <button class="btn btn-outline btn-sm" id="btn-battle-speed">速度：1x</button>
            <button class="btn btn-outline btn-sm" id="btn-battle-skip">跳过战斗</button>
          </div>
          <div class="cc-battle-hint" style="text-align:center;font-size:0.7rem;color:var(--text-muted);margin-top:6px;">点击敌人可锁定目标 | 大招就绪时可手动触发</div>
        </div>
      </div>

      <!-- 角色详情弹窗 -->
      <div class="modal-overlay" id="char-detail-modal" role="dialog" aria-modal="true" aria-labelledby="char-detail-name">
        <div class="modal cc-char-modal">
          <div class="modal-header">
            <h3 class="modal-title" id="char-detail-name"></h3>
            <button class="modal-close" id="char-detail-close" aria-label="关闭角色详情">&times;</button>
          </div>
          <div class="cc-char-detail-body" id="char-detail-body"></div>
          <div class="modal-footer" id="char-detail-footer"></div>
        </div>
      </div>

      <!-- 战斗结算弹窗 -->
      <div class="modal-overlay" id="battle-result-modal" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <div class="modal cc-result-modal">
          <div class="modal-header">
            <h3 class="modal-title" id="result-title"></h3>
            <button class="modal-close" id="result-close" aria-label="关闭战斗结算">&times;</button>
          </div>
          <div class="cc-result-body" id="result-body"></div>
          <div class="modal-footer">
            <button class="btn btn-gold btn-sm" id="result-ok">确定</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/shared-storage.js?v=34" defer></script>
  <script src="../js/shared.js?v=34" defer></script>
  <script src="../js/shared-data.js?v=34" defer></script>
  <script src="../js/shared-ui.js?v=34" defer></script>
  <script src="../js/shared-dialog.js?v=34" defer></script>
  <script src="../js/shared-transfer.js?v=34" defer></script>
  <script src="../js/shared-stats.js?v=34" defer></script>
  <script src="../js/shared-missions.js?v=34" defer></script>
  <script src="../js/shared-daily-ui.js?v=34" defer></script>
  <script src="../js/shared-nav.js?v=34" defer></script>
  <script src="../js/shared-settings.js?v=34" defer></script>
  <script src="../js/shared-sound.js?v=34" defer></script>
  <script src="../js/shared-lifecycle.js?v=34" defer></script>
  <script src="../js/shared-guide.js?v=34" defer></script>
  <script src="../js/pwa-updates.js?v=34" defer></script>
  <script src="../js/cardcollect-catalog.js?v=34" defer></script>
  <script src="../js/cardcollect-progression.js?v=34" defer></script>
  <script src="../js/cardcollect-roster.js?v=34" defer></script>
  <script src="../js/cardcollect-roster-view.js?v=34" defer></script>
  <script src="../js/game-scene-bridge.js?v=34" defer></script>
  <script src="../js/game-scene-cards.js?v=34" defer></script>
  <script src="../js/game-scene-ports.js?v=34" defer></script>
  <script src="../js/cardcollect.js?v=34" defer></script>
  <script type="module" src="../js/game-three-entry.js?v=34"></script>
</body>
</html>
